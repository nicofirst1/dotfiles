# =============================================================================
# LiteLLM router for agentmemory  —  IAIS GenAI (primary) + local Ollama (fallback)
# =============================================================================
# Provisioned by scripts/install-litellm-router.sh. Run by the LaunchAgent via
# scripts/litellm-router-run.sh, which exports IAIS_BASE_URL + FHG_API_KEY out
# of ~/.secrets.env (NO secrets live in this file or repo).
#
# Why IAIS GenAI (genai.iais.fraunhofer.de/api/v2) over corporate FhGenie:
#   - klartext battle-tested this endpoint; treated as always-up with net+creds.
#   - As of 2026-07, EVERY chat model IAIS hosts reports thinking_model:true
#     (Mistral-Small, the old non-reasoning pick, was retired from the catalog).
#
# Why Qwen3.5-122B-A10B for memory-default (was gpt-oss-20b, 2026-07-22):
#   gpt-oss-20b as deployed here has only a ~16-18k effective context window
#   (probed: a ~20k-token prompt already 400s with `max_tokens must be at least
#   1, got -1466`). agentmemory's mem::summarize / mem::graph-extract build
#   prompts of 22k-90k tokens on real Claude Code sessions (~275-450 tok/obs),
#   so they overflowed constantly -> the 400 tripped the fallback -> circuit
#   breaker -> pegged GPU. Shrinking SUMMARIZE_CHUNK_SIZE (400->200->50) only
#   delayed it and can't touch the graph path at all. Qwen3.5-122B-A10B was
#   probed 2026-07-22 to a clean 131,072-token (128k) ceiling and answers fast
#   (0.8s trivial, 3.9s @ 22k in, 4.6s @ 45k in) - 4x headroom over the worst
#   observed prompt, so overflow stops being possible for normal sessions.
#
# Auth: IAIS switched from HTTP Basic to a bearer API key (2026-07). LiteLLM
# sends `Authorization: Bearer <api_key>` by default, so api_key: os.environ/FHG_API_KEY
# is all that's needed - no extra_headers hack required anymore.
#
# Why a router at all: agentmemory's native FALLBACK_PROVIDERS is broken (#778) —
# it sends the PRIMARY model name to the fallback provider -> 404. The router maps
# each alias to its own provider+model, so fallback works correctly.

model_list:
  # ---- what agentmemory points at (OPENAI_MODEL=memory-default) --------------
  - model_name: memory-default
    litellm_params:
      model: openai/Qwen3.5-122B-A10B                      # IAIS, 128k context (probed 2026-07-22); replaces gpt-oss-20b's ~16-18k ceiling
      api_base: os.environ/IAIS_BASE_URL
      api_key: os.environ/FHG_API_KEY
      max_tokens: 8192                                     # ample for batch JSON
      timeout: 30                                          # qwen answers 4-5s even @ 45k in; 30s is 6x margin
  - model_name: memory-fallback
    litellm_params:
      model: openai/mistral:7b-instruct            # local Ollama, used only when
      api_base: http://localhost:11434/v1          # IAIS is unreachable
      api_key: ollama                              # (off-VPN / off-net).
      max_tokens: 4096                              # missing key caused a negative-max_tokens 400
      timeout: 140                                  # covers the 40-90s single-GPU-slot inference

  # ---- direct aliases (manual use / debugging; not in the auto chain) --------
  - model_name: iais-qwen-122b
    litellm_params:
      model: openai/Qwen3.5-122B-A10B
      api_base: os.environ/IAIS_BASE_URL
      api_key: os.environ/FHG_API_KEY
  - model_name: iais-gpt-oss-20b
    litellm_params:
      model: openai/gpt-oss-20b
      api_base: os.environ/IAIS_BASE_URL
      api_key: os.environ/FHG_API_KEY
  - model_name: ollama-mistral
    litellm_params:
      model: openai/mistral:7b-instruct
      api_base: http://localhost:11434/v1
      api_key: ollama

litellm_settings:
  # No global request_timeout: memory-default (~10s on-VPN) and memory-fallback
  # (40-90s local GPU) are ~10x apart in latency, so one number can't serve both -
  # each model carries its own `timeout:` above instead.
  num_retries: 0
  # IAIS primary -> Ollama fallback. Each alias carries its own model name,
  # which is exactly what sidesteps agentmemory bug #778. The fallback chain is
  # the retry, so num_retries stays 0 to avoid doubling latency on failure.
  fallbacks: [{"memory-default": ["memory-fallback"]}]
