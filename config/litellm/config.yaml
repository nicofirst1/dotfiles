# =============================================================================
# LiteLLM router for agentmemory  —  IAIS GenAI (primary) + local Ollama (fallback)
# =============================================================================
# Provisioned by scripts/install-litellm-router.sh. Run by the LaunchAgent via
# scripts/litellm-router-run.sh, which exports IAIS_BASE_URL + IAIS_AUTH_HEADER
# (Basic auth) out of ~/.employer-api-key (NO secrets live in this file or repo).
#
# Why IAIS GenAI (genai.iais.fraunhofer.de/api/v2) over corporate FhGenie:
#   - It hosts fast NON-reasoning instruct models. The old MiniMax-M2.5 was a
#     reasoning model: its hidden reasoning_content exhausted max_tokens and
#     returned EMPTY content, so graph extraction committed 0 nodes. A plain
#     instruct model (Mistral-Small) emits the answer directly — no reasoning tax.
#   - klartext battle-tested this endpoint; treated as always-up with net+creds.
#
# Auth: IAIS uses HTTP Basic (base64 user:pass), NOT a Bearer key. LiteLLM sends
# Bearer by default, so we inject the Basic header via extra_headers. api_key is
# an unused placeholder (extra_headers.Authorization wins on the wire).
#
# Why a router at all: agentmemory's native FALLBACK_PROVIDERS is broken (#778) —
# it sends the PRIMARY model name to the fallback provider -> 404. The router maps
# each alias to its own provider+model, so fallback works correctly.

model_list:
  # ---- what agentmemory points at (OPENAI_MODEL=memory-default) --------------
  - model_name: memory-default
    litellm_params:
      model: openai/Mistral-Small-3.2-24B-Instruct-2506   # IAIS, non-reasoning, ~10s
      api_base: os.environ/IAIS_BASE_URL
      api_key: "unused-basic-auth-in-extra_headers"
      extra_headers: {"Authorization": "os.environ/IAIS_AUTH_HEADER"}
      max_tokens: 8192                                     # ample for batch JSON
  - model_name: memory-fallback
    litellm_params:
      model: openai/mistral:7b-instruct            # local Ollama, used only when
      api_base: http://localhost:11434/v1          # IAIS is unreachable
      api_key: ollama                              # (off-VPN / off-net).

  # ---- direct aliases (manual use / debugging; not in the auto chain) --------
  - model_name: iais-mistral-small
    litellm_params:
      model: openai/Mistral-Small-3.2-24B-Instruct-2506
      api_base: os.environ/IAIS_BASE_URL
      api_key: "unused"
      extra_headers: {"Authorization": "os.environ/IAIS_AUTH_HEADER"}
  - model_name: iais-qwen-122b
    litellm_params:
      model: openai/Qwen3.5-122B-A10B
      api_base: os.environ/IAIS_BASE_URL
      api_key: "unused"
      extra_headers: {"Authorization": "os.environ/IAIS_AUTH_HEADER"}
  - model_name: iais-gpt-oss-120b
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: os.environ/IAIS_BASE_URL
      api_key: "unused"
      extra_headers: {"Authorization": "os.environ/IAIS_AUTH_HEADER"}
  - model_name: ollama-mistral
    litellm_params:
      model: openai/mistral:7b-instruct
      api_base: http://localhost:11434/v1
      api_key: ollama

litellm_settings:
  # 120s ceiling covers the SLOW fallback path: local mistral on a single GPU
  # runs 40-76s. The IAIS primary returns in ~10s, so this never bites it.
  request_timeout: 120
  num_retries: 1
  # IAIS primary -> Ollama fallback. Each alias carries its own model name,
  # which is exactly what sidesteps agentmemory bug #778.
  fallbacks: [{"memory-default": ["memory-fallback"]}]
